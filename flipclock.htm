<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻页时钟 - 屏幕保护程序</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #clockCanvas {
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <canvas id="clockCanvas"></canvas>

    <script>
        // ES5兼容代码
        (function() {
            var canvas = document.getElementById('clockCanvas');
            var ctx = canvas.getContext('2d');
            
            // 设置canvas尺寸
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
            
            // 配置参数
            var config = {
                cardWidth: 240,
                cardHeight: 280,
                cardSpacing: 40,
                borderRadius: 12,
                cardColor: '#1a1a1a',
                textColor: '#ffffff',
                dividerColor: '#333333',
                fontSize: 160,
                fontFamily: 'Arial, sans-serif'
            };
            
            // 当前时间值（两位数字字符串）
            var currentTime = {
                hour: '00',
                minute: '00',
                second: '00'
            };
            
            // 翻页动画状态
            var flipAnimations = {
                hour: { progress: 0, newValue: '00', isAnimating: false },
                minute: { progress: 0, newValue: '00', isAnimating: false },
                second: { progress: 0, newValue: '00', isAnimating: false }
            };
            
            // 补零函数（ES5兼容）
            function padZero(num) {
                var str = num.toString();
                if (str.length < 2) {
                    return '0' + str;
                }
                return str;
            }
            
            // 绘制圆角矩形
            function drawRoundedRect(x, y, width, height, radius) {
                ctx.beginPath();
                ctx.moveTo(x + radius, y);
                ctx.lineTo(x + width - radius, y);
                ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                ctx.lineTo(x + width, y + height - radius);
                ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                ctx.lineTo(x + radius, y + height);
                ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                ctx.lineTo(x, y + radius);
                ctx.quadraticCurveTo(x, y, x + radius, y);
                ctx.closePath();
            }
            
            // 绘制两位数字卡片
            function drawCard(x, y, value, flipAnim) {
                var centerX = x + config.cardWidth / 2;
                var centerY = y + config.cardHeight / 2;
                var halfHeight = config.cardHeight / 2;
                
                // 绘制卡片背景
                ctx.fillStyle = config.cardColor;
                drawRoundedRect(x, y, config.cardWidth, config.cardHeight, config.borderRadius);
                ctx.fill();
                
                // 绘制中间分割线
                ctx.strokeStyle = config.dividerColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + 10, centerY);
                ctx.lineTo(x + config.cardWidth - 10, centerY);
                ctx.stroke();
                
                // 设置字体
                ctx.fillStyle = config.textColor;
                ctx.font = 'bold ' + config.fontSize + 'px ' + config.fontFamily;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // 如果有翻页动画
                if (flipAnim && flipAnim.isAnimating) {
                    var progress = flipAnim.progress;
                    // 使用缓动函数使动画更自然（ease-in-out）
                    var easedProgress = progress < 0.5 
                        ? 2 * progress * progress 
                        : 1 - Math.pow(-2 * progress + 2, 3) / 2;
                    
                    var angle = easedProgress * Math.PI; // 0 到 PI
                    var scaleY = Math.cos(angle);
                    var offsetY = Math.sin(angle) * halfHeight * 0.3; // 添加轻微的Y轴偏移
                    
                    // 绘制上半部分（当前值）- 正在向下翻页
                    ctx.save();
                    // 裁剪到上半部分
                    ctx.beginPath();
                    ctx.rect(x, y, config.cardWidth, halfHeight);
                    ctx.clip();
                    
                    // 应用3D翻转效果 - 上半部分向下翻转
                    ctx.translate(centerX, centerY);
                    ctx.scale(1, Math.max(0, scaleY)); // 确保不出现负值
                    ctx.translate(-centerX, -centerY - offsetY);
                    
                    // 添加透视透明度效果
                    ctx.globalAlpha = Math.max(0.2, scaleY);
                    
                    // 绘制完整数字，但只显示上半部分（因为裁剪）
                    ctx.fillText(value, centerX, centerY);
                    
                    ctx.restore();
                    
                    // 绘制下半部分（新值）- 正在向上翻页
                    ctx.save();
                    // 裁剪到下半部分
                    ctx.beginPath();
                    ctx.rect(x, centerY, config.cardWidth, halfHeight);
                    ctx.clip();
                    
                    // 应用3D翻转效果 - 下半部分向上翻转
                    ctx.translate(centerX, centerY);
                    ctx.scale(1, Math.max(0, -scaleY)); // 确保不出现负值
                    ctx.translate(-centerX, -centerY + offsetY);
                    
                    // 添加透视透明度效果
                    ctx.globalAlpha = Math.max(0.2, -scaleY);
                    
                    // 绘制完整数字，但只显示下半部分（因为裁剪）
                    ctx.fillText(flipAnim.newValue, centerX, centerY);
                    
                    ctx.restore();
                    
                    // 绘制翻页时的阴影效果（在中间位置，模拟翻页时的阴影）
                    if (progress > 0.3 && progress < 0.7) {
                        ctx.save();
                        var shadowIntensity = Math.sin(progress * Math.PI);
                        ctx.globalAlpha = shadowIntensity * 0.5;
                        ctx.fillStyle = '#000000';
                        var shadowHeight = (1 - Math.abs(progress - 0.5) * 2) * 8;
                        ctx.fillRect(x, centerY - shadowHeight / 2, config.cardWidth, shadowHeight);
                        ctx.restore();
                    }
                    
                    // 重置透明度
                    ctx.globalAlpha = 1;
                } else {
                    // 正常显示 - 上半部分
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x, y, config.cardWidth, halfHeight);
                    ctx.clip();
                    ctx.fillText(value, centerX, centerY);
                    ctx.restore();
                    
                    // 正常显示 - 下半部分
                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x, centerY, config.cardWidth, halfHeight);
                    ctx.clip();
                    ctx.fillText(value, centerX, centerY);
                    ctx.restore();
                }
            }
            
            // 更新动画
            function updateAnimations() {
                var animating = false;
                for (var key in flipAnimations) {
                    if (flipAnimations.hasOwnProperty(key)) {
                        var anim = flipAnimations[key];
                        if (anim.isAnimating) {
                            // 使用固定的动画速度，确保流畅
                            anim.progress += 0.1;
                            if (anim.progress >= 1) {
                                anim.progress = 0;
                                anim.isAnimating = false;
                                // 更新当前值
                                currentTime[key] = anim.newValue;
                            } else {
                                animating = true;
                            }
                        }
                    }
                }
                return animating;
            }
            
            // 检查并触发翻页动画
            function checkAndFlip(key, newValue) {
                if (currentTime[key] !== newValue) {
                    var anim = flipAnimations[key];
                    if (!anim.isAnimating) {
                        anim.newValue = newValue;
                        anim.progress = 0;
                        anim.isAnimating = true;
                    }
                }
            }
            
            // 初始化时间值
            function initTime() {
                var now = new Date();
                var hours = now.getHours();
                var minutes = now.getMinutes();
                var seconds = now.getSeconds();
                
                currentTime.hour = padZero(hours);
                currentTime.minute = padZero(minutes);
                currentTime.second = padZero(seconds);
            }
            
            // 更新时钟
            function updateClock() {
                var now = new Date();
                var hours = now.getHours();
                var minutes = now.getMinutes();
                var seconds = now.getSeconds();
                
                var hourStr = padZero(hours);
                var minuteStr = padZero(minutes);
                var secondStr = padZero(seconds);
                
                // 检查并触发翻页
                checkAndFlip('hour', hourStr);
                checkAndFlip('minute', minuteStr);
                checkAndFlip('second', secondStr);
            }
            
            // 绘制日期
            function drawDate() {
                var now = new Date();
                var year = now.getFullYear();
                var month = now.getMonth() + 1;
                var date = now.getDate();
                
                var dateText = year + '年' + month + '月' + date + '日';
                
                ctx.fillStyle = '#ffffff';
                ctx.font = '36px ' + config.fontFamily;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                
                var dateY = 60;
                ctx.fillText(dateText, canvas.width / 2, dateY);
            }
            
            // 绘制时钟
            function drawClock() {
                // 清空画布
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 绘制日期
                drawDate();
                
                // 计算起始位置（居中，考虑日期占用的空间）
                var totalWidth = config.cardWidth * 3 + config.cardSpacing * 2;
                var startX = (canvas.width - totalWidth) / 2;
                var dateHeight = 100; // 日期区域高度
                var startY = (canvas.height - config.cardHeight) / 2 + dateHeight / 2;
                
                var x = startX;
                
                // 绘制小时
                var hourAnim = flipAnimations.hour.isAnimating ? flipAnimations.hour : null;
                drawCard(x, startY, currentTime.hour, hourAnim);
                x += config.cardWidth + config.cardSpacing;
                
                // 绘制分钟
                var minuteAnim = flipAnimations.minute.isAnimating ? flipAnimations.minute : null;
                drawCard(x, startY, currentTime.minute, minuteAnim);
                x += config.cardWidth + config.cardSpacing;
                
                // 绘制秒
                var secondAnim = flipAnimations.second.isAnimating ? flipAnimations.second : null;
                drawCard(x, startY, currentTime.second, secondAnim);
            }
            
            // 动画循环
            function animate() {
                var hasAnimation = updateAnimations();
                updateClock();
                drawClock();
                
                // 持续动画循环以确保流畅
                if (typeof requestAnimationFrame !== 'undefined') {
                    requestAnimationFrame(animate);
                } else {
                    setTimeout(animate, 16); // 约60fps
                }
            }
            
            // 初始化
            initTime();
            updateClock();
            drawClock();
            
            // 启动动画循环
            animate();
            
            // 每秒更新一次时间
            setInterval(updateClock, 1000);
            
            // 防止右键菜单
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            }, false);
            
            // 防止选择文本
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            }, false);
        })();
    </script>
</body>
</html>
